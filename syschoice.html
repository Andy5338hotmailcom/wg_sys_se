<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择操作系统</title>
    <link rel="stylesheet" href="boot/boot.css">
</head>
<body>

    <main class="boot-page">
        <h1 class="boot-title">选择操作系统</h1>

        <nav class="boot-options" aria-label="操作系统选项">

                <div class="boot-option-copy">
                    <h2>WildGoose SE</h2>
                    <p>主系统</p>
                </div>
            </a>

            <a class="boot-option" href="setup/index.html">
                <div class="boot-option-copy">
                    <h2>Setup</h2>
                    <p>系统安装</p>
                </div>
            </a>
        </nav>

        <div class="boot-actions">
            <a class="boot-button" href="boot/index.html">
                <span aria-hidden="true">•••</span>更多选项
            </a>
            <a class="boot-button" href="shutdown.html">
                <span aria-hidden="true">⏻</span>关闭计算机

</html>
