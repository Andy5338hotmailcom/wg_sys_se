<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择操作系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9333ea',
                        secondary: '#a855f7',
                        accent: '#c084fc',
                        light: '#f3e8ff',
                        dark: '#4c1d95'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.15)',
                        'neon': '0 0 5px theme("colors.accent"), 0 0 20px theme("colors.accent")'
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-effect {
                @apply bg-white/10 backdrop-blur-md border border-white/20 shadow-glass;
            }
            .btn-hover {
                @apply transition-all duration-300 hover:shadow-neon hover:scale-105;
            }
            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-primary to-accent;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-light to-secondary p-4">
    <!-- 主容器 -->
    <div class="w-full max-w-md glass-effect rounded-2xl p-8 animate-float">
        <!-- 标题 -->
        <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-center mb-10 text-gradient">
            <i class="fa fa-desktop mr-3"></i>选择操作系统
        </h1>
        
        <!-- 选择框容器 -->
        <div class="space-y-6">
            <!-- WildGoose BE 选择框 -->
            <div class="glass-effect rounded-xl p-6 btn-hover cursor-pointer" onclick="window.location.href='login.html'">
                <div class="flex items-center">
                    <div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center mr-4">
                        <i class="fa fa-feather text-2xl text-primary"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-semibold text-white">WildGoose BE</h2>
                        <p class="text-light/80 text-sm">主系统</p>
                    </div>
                </div>
            </div>
            
            <!-- Setup 选择框 -->
            <div class="glass-effect rounded-xl p-6 btn-hover cursor-pointer" onclick="window.location.href='setup/index.html'">
                <div class="flex items-center">
                    <div class="w-12 h-12 rounded-full bg-accent/20 flex items-center justify-center mr-4">
                        <i class="fa fa-cog text-2xl text-accent"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-semibold text-white">Setup</h2>
                        <p class="text-light/80 text-sm">系统安装</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部按钮 -->
        <div class="mt-10 grid grid-cols-2 gap-4">
            <button class="glass-effect text-white py-3 rounded-lg btn-hover flex items-center justify-center" onclick="window.location.href='boot/index.html'">
                <i class="fa fa-ellipsis-h mr-2"></i>更多选项
            </button>
            <button class="glass-effect text-white py-3 rounded-lg btn-hover flex items-center justify-center" onclick="window.location.href='shutdown.html'">
                <i class="fa fa-power-off mr-2"></i>关闭计算机
            </button>
        </div>
    </div>
    
    <!-- 装饰元素 -->
    <div class="fixed top-10 left-10 w-20 h-20 rounded-full bg-primary/10 blur-xl animate-pulse-slow"></div>
    <div class="fixed bottom-10 right-10 w-32 h-32 rounded-full bg-accent/10 blur-xl animate-pulse-slow" style="animation-delay: 1s;"></div>
    
    <script>
        // 为选择框添加点击音效（可选）
        document.querySelectorAll('.btn-hover').forEach(box => {
            box.addEventListener('click', function() {
                // 可以在这里添加点击音效
                // const audio = new Audio('click-sound.mp3');
                // audio.play();
            });
        });
    </script>
</body>
</html>
