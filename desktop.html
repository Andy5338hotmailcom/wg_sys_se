<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildgoose OS</title>
    <link id="desktop-theme" rel="stylesheet">
    <link rel="stylesheet" href="wgui.css" data-wgui-styles>
    <script src="wgui.js"></script>
    <script>
        let theme = localStorage.getItem("WG_color");
        if (!theme) {
            theme = "w";
            localStorage.setItem("WG_color", theme);
        }
        document.getElementById("desktop-theme").href =
            theme === "w" ? "whitedesktop.css" : "blackdesktop.css";

        const defaultDesktopWallpaper = "./wallpaper/wildgoose/bg.jpg";
        const defaultDesktopWallpaperTime = 60;
        const getDesktopWallpaperTime = value => {
            const seconds = Number(value);
            return Number.isInteger(seconds) && seconds >= 1
                ? seconds
                : defaultDesktopWallpaperTime;
        };
        let desktopWallpaperTimer = null;
        let desktopWallpaperPaths = [];
        let desktopWallpaperIndex = 0;
        window.applyDesktopWallpaper = (wallpaper, interval) => {
            desktopWallpaperPaths = (wallpaper || defaultDesktopWallpaper)
                .split(",")
                .map(path => path.trim())
                .filter(Boolean);
            if (desktopWallpaperPaths.length === 0) {
                desktopWallpaperPaths = [defaultDesktopWallpaper];
            }
            desktopWallpaperIndex = 0;
            const applyCurrentWallpaper = () => {
                document.documentElement.style.setProperty(
                    "--desktop-wallpaper",
                    `url(${JSON.stringify(desktopWallpaperPaths[desktopWallpaperIndex])})`
                );
            };
            applyCurrentWallpaper();
            if (desktopWallpaperTimer !== null) {
                clearInterval(desktopWallpaperTimer);
                desktopWallpaperTimer = null;
            }
            const switchTime = getDesktopWallpaperTime(
                interval || localStorage.getItem("WG_desktop_wallpaper_time")
            );
            if (desktopWallpaperPaths.length > 1) {
                desktopWallpaperTimer = setInterval(() => {
                    desktopWallpaperIndex = (desktopWallpaperIndex + 1) % desktopWallpaperPaths.length;
                    applyCurrentWallpaper();
                }, switchTime * 1000);
            }
        };
        let desktopWallpaper = localStorage.getItem("WG_desktop_wallpaper");
        if (desktopWallpaper === null) {
            desktopWallpaper = defaultDesktopWallpaper;
            localStorage.setItem("WG_desktop_wallpaper", desktopWallpaper);
        }
        let desktopWallpaperTime = String(
            getDesktopWallpaperTime(localStorage.getItem("WG_desktop_wallpaper_time"))
        );
        if (localStorage.getItem("WG_desktop_wallpaper_time") !== desktopWallpaperTime) {
            localStorage.setItem("WG_desktop_wallpaper_time", desktopWallpaperTime);
        }
        window.applyDesktopWallpaper(desktopWallpaper, desktopWallpaperTime);
        window.addEventListener("storage", event => {
            if (event.key === "WG_desktop_wallpaper") {
                desktopWallpaper = event.newValue || defaultDesktopWallpaper;
                if (event.newValue === null) {
                    localStorage.setItem("WG_desktop_wallpaper", desktopWallpaper);
                }
                window.applyDesktopWallpaper(
                    desktopWallpaper,
                    localStorage.getItem("WG_desktop_wallpaper_time")
                );
            } else if (event.key === "WG_desktop_wallpaper_time") {
                desktopWallpaperTime = String(getDesktopWallpaperTime(event.newValue));
                if (event.newValue !== desktopWallpaperTime) {
                    localStorage.setItem("WG_desktop_wallpaper_time", desktopWallpaperTime);
                }
                window.applyDesktopWallpaper(desktopWallpaper, desktopWallpaperTime);
            }
        });
    </script>
    <script src="desktop.js"></script>
</head>
<body>

<!-- ======================== -->
<!-- 1. 桌面图标区域 -->
<!-- ======================== -->
<div id="desktop-icons"></div>

<!-- ======================== -->
<!-- 2. 任务栏 -->
<!-- ======================== -->
<div class="taskbar">
    <button class="start-btn">开始</button>
    <div class="task-apps"></div>
    <div class="task-right">
        <div class="wifi" id="wifi" title="Wi-Fi">
            <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
                <path d="M2.8 8.9a15 15 0 0 1 18.4 0" opacity="0.7"/>
                <path d="M5.9 12.4a10.4 10.4 0 0 1 12.2 0" opacity="0.85"/>
                <path d="M9.1 15.9a5.4 5.4 0 0 1 5.8 0"/>
                <circle cx="12" cy="19.2" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
        </div>
        <div class="battery" id="battery" title="电源">
            <span class="battery-shell"><span class="battery-fill" id="batteryFill"></span></span>
            <span class="battery-bolt" id="batteryBolt" hidden>⚡</span>
            <span class="battery-mark" id="batteryMark" hidden>?</span>
        </div>
        <div class="time" id="time">
            <span class="time-clock" id="timeClock"></span>
            <span class="time-date" id="timeDate"></span>
        </div>
        <div class="show-desktop" aria-label="显示桌面" title="显示桌面"></div>
    </div>
</div>

<!-- 时间面板：点任务栏时间弹出，内容在根目录的 time.html -->
<div class="time-panel" id="timePanel" hidden>
    <iframe id="timeFrame" src="time.html" title="日期与时间" scrolling="no"></iframe>
</div>

<!-- Wi-Fi 面板：点任务栏 Wi-Fi 图标弹出，内容在根目录的 wifi.html -->
<div class="wifi-panel" id="wifiPanel" hidden>
    <iframe id="wifiFrame" src="wifi.html" title="Wi-Fi"></iframe>
</div>

<!-- 电源面板：点任务栏电池图标弹出 -->
<div class="battery-panel" id="batteryPanel" hidden>
    <div class="battery-panel-head">
        <span class="battery-panel-title">电源</span>
        <button class="battery-refresh" id="batteryRefresh" type="button" title="重新检测" aria-label="重新检测" hidden>⟳</button>
    </div>
    <div class="battery-panel-main">
        <div class="battery-big" id="batteryBig">
            <span class="battery-big-shell"><span class="battery-big-fill" id="batteryBigFill"></span></span>
            <span class="battery-big-mark" id="batteryBigMark" hidden>?</span>
        </div>
        <div class="battery-panel-info">
            <div class="battery-percent" id="batteryPercent">—</div>
            <div class="battery-state" id="batteryState">读取中…</div>
        </div>
    </div>
    <div class="battery-panel-foot">
        <a class="battery-download" id="batteryDownload" href="apps/wg_connect/app/windows/0.3.1.exe" download="wg_connect_0.3.1.exe" hidden>下载本地服务</a>
    </div>
    <div class="battery-panel-tip" id="batteryPanelTip"></div>
</div>

<!-- ======================== -->
<!-- 3. 开始菜单（iframe 容器，主体逻辑在 startmenu.html） -->
<!-- ======================== -->
<div class="start-menu" id="startMenu">
    <iframe id="startMenuFrame" src="startmenu.html" title="开始菜单" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>
</div>

<!-- ======================== -->
<!-- 4. 窗口容器 -->
<!-- ======================== -->
<div id="window-container"></div>

<script>
    window.addEventListener("keydown", event => {
        if (event.key !== "Meta" && event.code !== "MetaLeft" && event.code !== "MetaRight"
            && event.keyCode !== 91 && event.keyCode !== 92) return;
        if (event.repeat) return;

        const startButton = document.querySelector(".start-btn");
        if (startButton) startButton.click();
    });
</script>

</body>
</html>
