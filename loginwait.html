<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在登录 Wildgoose OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: url("./wallpaper/wildgoose/bg.jpg") center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 30px;
            color: white;
            font-family: "Microsoft YaHei", sans-serif;
        }

            /* 半透明遮罩，让文字更清晰 */
            body::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                z-index: 1;
            }

        /* 标题 */
        .title {
            font-size: 28px;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            z-index: 2;
            animation: fadeIn 1s ease forwards;
        }

        /* 加载动画 ✅ 修复完成 */
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            z-index: 2;
            opacity: 0;
            /* 这里修复：同时执行淡入 + 无限旋转 */
            animation: fadeIn 1s ease 0.5s forwards, spin 1s linear infinite;
        }

        /* 提示文字 */
        .tip {
            font-size: 16px;
            color: #ccc;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
            z-index: 2;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        /* 淡入动画 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 旋转动画 ✅ 这里是核心BUG！原来只转10度，现在改成360度正常转圈 */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<audio id="startSound" src="media\startup.mp3" preload="auto" autoplay></audio>

<body>
    <div class="title">欢迎回来，正在登录系统</div>
    <div class="loader"></div>
    <div class="tip">Wildgoose OS 正在启动...</div>

    <script>
        // 等待 8 秒 → 平滑跳转到桌面
        setTimeout(() => {
            window.location.replace("desktop.html");
        }, 8000);
    </script>
</body>
</html>
