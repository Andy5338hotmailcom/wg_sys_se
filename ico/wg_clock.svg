<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="时钟">
  <rect rx="12" width="100" height="100" fill="#C8BFE7"/>

  <!-- 表盘 -->
  <circle cx="50" cy="50" r="30" fill="#fff"/>

  <!-- 四向刻度：12 / 3 / 6 / 9 -->
  <g stroke="#7563A6" stroke-width="2.5" stroke-linecap="round">
    <line x1="50" y1="23" x2="50" y2="28"/>
    <line x1="72" y1="50" x2="77" y2="50"/>
    <line x1="50" y1="72" x2="50" y2="77"/>
    <line x1="23" y1="50" x2="28" y2="50"/>
  </g>

  <!-- 指针：时针指向 10，分针指向 2 -->
  <g stroke="#7563A6" stroke-linecap="round">
    <line x1="50" y1="50" x2="38" y2="43" stroke-width="7"/>
    <line x1="50" y1="50" x2="69" y2="39" stroke-width="5"/>
  </g>

  <!-- 轴心 -->
  <circle cx="50" cy="50" r="3.6" fill="#7563A6"/>
</svg>
