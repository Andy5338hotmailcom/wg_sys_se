<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildgoose 安装 - 区域和语言</title>
    <link rel="stylesheet" href="wizard.css">
</head>
<body>
    <main class="setup-shell">
        <header class="setup-header">
            <img src="../icon.png" alt="" class="setup-logo">
            <h1>Wildgoose</h1>
        </header>
        <section class="setup-card" aria-labelledby="page-title">
            <p class="step-label">安装向导 · 第 1 步，共 4 步</p>
            <h2 id="page-title">区域和语言设置</h2>
            <p class="intro">请选择安装时使用的语言、时间格式和键盘输入方式。</p>
            <div class="form-fields">
                <label class="field">
                    <span>要安装的语言</span>
                    <select id="install-language">
                        <option value="zh-cn">中文简体</option>
                        <option value="en-us">English</option>
                    </select>
                </label>
                <label class="field">
                    <span>时间和货币格式</span>
                    <select id="time-format">
                        <option value="system">跟随系统</option>
                        <option value="test2">跟随系统2</option>
                    </select>
                </label>
                <label class="field">
                    <span>键盘和输入方法</span>
                    <select id="keyboard-input">
                        <option value="zh-cn">中文简体</option>
                        <option value="chinese">Chinese Simplified</option>
                    </select>
                </label>
            </div>
            <div class="actions actions-split">
                <a class="button button-secondary" href="stop.html">取消安装</a>
                <button class="button button-primary" id="next-step" type="button">下一步</button>
            </div>
        </section>
    </main>
    <script>
        const fields = {
            "install-language": "WG_setup_language",
            "time-format": "WG_setup_time_format",
            "keyboard-input": "WG_setup_keyboard"
        };
        Object.entries(fields).forEach(([id, key]) => {
            const select = document.getElementById(id);
            const savedValue = localStorage.getItem(key);
            if (savedValue && [...select.options].some(option => option.value === savedValue)) {
                select.value = savedValue;
            }
        });
        const languageSelect = document.getElementById("install-language");
        const nextStepButton = document.getElementById("next-step");
        const multilingualSetupUrl = "https://andy5338hotmailcom.github.io/wg_se_sys_multilingual/en-us/setup";

        function updateNextStepLabel() {
            nextStepButton.textContent = languageSelect.value === "en-us" ? "应用" : "下一步";
        }

        languageSelect.addEventListener("change", updateNextStepLabel);
        updateNextStepLabel();

        nextStepButton.addEventListener("click", () => {
            Object.entries(fields).forEach(([id, key]) => {
                localStorage.setItem(key, document.getElementById(id).value);
            });
            window.location.href = languageSelect.value === "en-us"
                ? multilingualSetupUrl
                : "2.html";
        });
    </script>
</body>
</html>
