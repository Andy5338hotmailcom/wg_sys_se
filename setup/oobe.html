<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wildgoose 安装</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d1a;
    }
    #oobeFrame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
    }
    /* 自动播放被拦时才出现的一层，点一下就消失，用来解锁音频 */
    #audioGate {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 180px;
        background: rgba(243, 240, 252, 0.94);
        color: #6b5ca5;
        font-family: "Microsoft YaHei", "微软雅黑", "Segoe UI", sans-serif;
        font-size: 15px;
        letter-spacing: 2px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        animation: gateIn 0.4s ease both;
    }
    @keyframes gateIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    #audioGate[hidden] { display: none; }
</style>
</head>
<body>
<iframe id="oobeFrame" src="oobe1.html" title="Wildgoose 安装流程"></iframe>

<div id="audioGate" hidden>点击任意位置开始</div>

<script>
    (function () {
        var frame = document.getElementById("oobeFrame");
        var gate = document.getElementById("audioGate");

        // ===== 背景音乐：挂在这一层，iframe 里怎么翻都不打断 =====
        var startAudio = new Audio("../media/oobestart.wav");
        var bgAudio = new Audio("../media/oobebackground.wav");

        startAudio.volume = 0.3;
        bgAudio.volume = 0.3;
        bgAudio.loop = true;

        var bgStarted = false;

        function startBackground() {
            if (bgStarted) return;
            bgStarted = true;
            bgAudio.play().catch(function () {});
        }

        startAudio.addEventListener("ended", startBackground);
        startAudio.addEventListener("error", startBackground);

        function playStart() {
            startAudio.play().catch(function () {
                // 被自动播放策略拦下：露出提示层，等用户点一下
                gate.hidden = false;
            });
        }

        // 点任意位置：收起提示，重新解锁并播放
        gate.addEventListener("pointerdown", function (e) {
            e.preventDefault();
            gate.hidden = true;
            startAudio.play().catch(function () {
                // 再被拦就安静放弃，不反复弹提示挡操作
            });
        });

        // 打开就直接试
        playStart();

        // ===== 只有 oobeFinish 点完成时才发消息，这里整页跳到 end.html =====
        window.addEventListener("message", function (e) {
            if (e.source !== frame.contentWindow) return;
            if (!e.data || e.data.type !== "wg-oobe-finish") return;
            location.href = e.data.url || "end.html";
        });
    })();
</script>
</body>
</html>
