<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildgoose 安装 - 现在安装</title>
    <link rel="stylesheet" href="wizard.css">
</head>
<body>
    <main class="setup-shell">
        <header class="setup-header">
            <img src="../icon.png" alt="" class="setup-logo">

            <div class="actions actions-split">
                <a class="button button-secondary" href="index.html">上一步</a>
                <button class="button button-primary" id="install-now" type="button">现在安装</button>
            </div>
        </section>
    </main>
    <script>
        document.getElementById("install-now").addEventListener("click", () => {
            window.location.href = "3.html";
        });
    </script>

</html>
