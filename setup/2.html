<html style="height:100%;">

<head>
    <style>
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding: 0;
            margin: 0;
        }

        loading > svg > circle:first-child {
            stroke: #fff;
            fill: none;
            stroke-width: 2px;
            stroke-linecap: round;
            animation: spin-infinite 2.5s linear 0s infinite normal none running;
            transform-origin: 50% 50%;
        }

        loading > svg > circle:last-child {
            fill: #00000000
        }

        loading > svg {
            background-color: #00000000;
            border-radius: 50%
        }

        @keyframes spin-infinite {
            0% {
                stroke-dasharray: .01px, 43.97px;
                transform: rotate(0deg)
            }

            50% {
                stroke-dasharray: 21.99px, 21.99px;
                transform: rotate(450deg)
            }

            to {
                stroke-dasharray: .01px, 43.97px;
                transform: rotate(3turn)
            }
        }
    </style>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在安装</title>
</head>

<body>
    <loading id="ld">
        <svg width="50px" height="50px" viewBox="0 0 16 16">
            <circle cx="8px" cy="8px" r="7px"></circle>
            <circle cx="8px" cy="8px" r="6px"></circle>
        </svg>
    </loading>
    <p id="ldt" style="text-align:center;color:#fff;font-size:20px">
        正在启动第二部安装
    </p>

    <script>
        
        let x = 0;
        const text = document.getElementById('ldt');

        
        const timer = setInterval(() => {
            x++;
            text.innerText = `已完成安装 ${x}% \n 请不要关机`;

            
            if (x >= 100) {
                clearInterval(timer);
                location.href = 'oobe1.html';
            }
        }, 250);
    </script>
</body>

</html>
