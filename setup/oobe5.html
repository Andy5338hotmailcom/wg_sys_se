<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>安装软件 - Wildgoose OOBE</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif;}
body {
    background: linear-gradient(120deg, #e8dff8, #f3eafb);
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.title-text {
    position: absolute;
    top: 80px;
    left: 60px;
    animation: fadeInUp 1.2s ease-out;
}
.title-text h1 {
    color: #4b2e83;
    font-size: 36px;
    font-weight: 600;
}
.title-text p {
    color: #6b4e99;
    margin-top: 12px;
    font-size: 18px;
}

/* 自适应容器 + 留白边缘 */
.iframe-wrapper {
    margin-top: 180px;
    width: 90%;
    max-width: 900px;
    height: calc(70vh - 100px);
    padding: 20px;
    background: rgba(255,255,255,0.5);
    border-radius: 24px;
    animation: fadeInUp 1.2s 0.2s both;
}

/* 自动适配屏幕的 iframe */
.app-iframe {
    width: 100%;
    height: 100%;
    border: 1px solid #d4c5f0;
    border-radius: 16px;
    background: #fff;
    display: block;
}

.next-btn {
    margin-top: 30px;
    width: 380px;
    height: 60px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(90deg, #9c7cdd, #b198ee);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    animation: fadeInUp 1.2s 0.4s both;
}
.next-btn:hover {
    transform: scale(1.02);
    opacity: 0.9;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="title-text">
    <h1>安装软件</h1>
    <p>Wildgoose Beginning Edition</p>
</div>

<div class="iframe-wrapper">
    <iframe src="../apps/appstore/index.html" class="app-iframe" frameborder="0"></iframe>
</div>

<button class="next-btn" onclick="goNext()">继续</button>

<script>
function goNext() {
    location.href = "oobeFinish.html";
}
</script>
</body>
</html>
