<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildgoose 安装 - 正在安装</title>
    <link rel="stylesheet" href="wizard.css">
</head>
<body class="setup-body-install">
    <main class="setup-shell setup-shell-install">
        <header class="setup-header">
            <img src="../icon.png" alt="" class="setup-logo">
            <h1>Wildgoose</h1>
        </header>
        <section class="setup-card setup-card-install" aria-labelledby="page-title">
            <p class="step-label">安装向导 · 安装阶段</p>
            <h2 id="page-title" hidden>正在安装 Wildgoose</h2>

            <div class="install-stepper" aria-label="安装进度">
                <div class="install-step" data-step="3">
                    <span class="install-step-number">3</span>
                    <span>确认安装</span>
                </div>
                <div class="install-step-line install-step-line-complete">
                    <span id="progress-line-1"></span>
                </div>
                <div class="install-step install-step-active" data-step="4">
                    <span class="install-step-number" id="step-2-indicator">4</span>
                    <span>正在安装</span>
                </div>
                <div class="install-step-line">
                    <span id="progress-line-2"></span>
                </div>
                <div class="install-step" data-step="5">
                    <span class="install-step-number" id="step-3-indicator">5</span>
                    <span>安装完成</span>
                </div>
            </div>

            <div class="steps-container">
                <section class="install-step-content step" id="step-1" aria-labelledby="confirm-title">
                    <div class="install-step-heading">
                        <span class="install-icon" aria-hidden="true">i</span>
                        <h2 id="confirm-title">欢迎使用系统安装向导</h2>
                        <p>请确认您要安装此系统。安装过程将需要几分钟时间。</p>
                    </div>
                    <div class="install-system-info">
                        <h3>系统信息</h3>
                        <dl>
                            <div>
                                <dt>系统版本</dt>
                                <dd>Wildgoose Second Preview Edition</dd>
                            </div>
                            <div>
                                <dt>所需空间</dt>
                                <dd>5 GB</dd>
                            </div>
                            <div>
                                <dt>系统要求</dt>
                                <dd>8 GB RAM，64 GB 磁盘空间</dd>
                            </div>
                            <div>
                                <dt>当前系统</dt>
                                <dd>符合全部要求</dd>
                            </div>
                        </dl>
                    </div>
                    <div class="actions actions-split">
                        <button class="button button-secondary" id="cancel-btn" type="button">取消</button>
                        <button class="button button-primary" id="start-install" type="button">确认安装</button>
                    </div>
                </section>

                <section class="install-step-content step active" id="step-2" aria-labelledby="install-title">
                    <div class="install-step-heading install-heading-compact">
                        <h2 class="install-main-title" id="install-title">正在安装系统</h2>
                    </div>
                    <div class="img-wrap" aria-label="Wildgoose 系统功能介绍">
                        <img class="slide-img active" src="./slide1.png" data-caption="新版 Wildgoose 开始菜单" alt="">
                        <img class="slide-img" src="./slide1.png" data-caption="新版 Wildgoose 开始菜单" alt="">
                        <img class="slide-img" src="./slide2.png" data-caption="滑动到一角或一边，窗口自动分屏（左上角）" alt="">
                        <img class="slide-img" src="./slide3.png" data-caption="滑动到一角或一边，窗口自动分屏（左边）" alt="">
                        <img class="slide-img" src="./slide4.png" data-caption="滑动到一角或一边，窗口自动分屏（左下角）" alt="">
                        <img class="slide-img" src="./slide5.png" data-caption="滑动到一角或一边，窗口自动分屏（右上角）" alt="">
                        <img class="slide-img" src="./slide6.png" data-caption="滑动到一角或一边，窗口自动分屏（右边）" alt="">
                        <img class="slide-img" src="./slide7.png" data-caption="滑动到一角或一边，窗口自动分屏（右下角）" alt="">
                        <img class="slide-img" src="./slide8.png" data-caption="支持固定到任务栏" alt="">
                        <img class="slide-img" src="./slide8.png" data-caption="支持固定到任务栏" alt="">
                    </div>
                    <p class="slide-caption" id="slide-caption">新版 Wildgoose 开始菜单</p>
                    <p class="install-status-text" id="installation-status">正在准备安装文件…</p>
                    <div class="actions">
                        <button class="button button-secondary" id="cancel-install" type="button">取消安装</button>
                    </div>
                </section>

                <section class="install-step-content step" id="step-3" aria-labelledby="complete-title">
                    <div class="install-step-heading">
                        <span class="install-icon install-icon-success" aria-hidden="true">✓</span>
                        <h2 id="complete-title">安装完成</h2>
                        <p>系统已成功安装。请继续完成后续设置。</p>
                    </div>
                    <div class="actions">
                        <button class="button button-primary" id="restart-now" type="button">进入第二阶段</button>
                    </div>
                </section>
            </div>

            <div class="install-progress" aria-label="安装进度">
                <div
                    class="install-progress-track"
                    id="progress-bar-track"
                    role="progressbar"
                    aria-label="系统安装进度"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0">
                    <div id="progress-bar" class="install-progress-bar"></div>
                </div>
                <div class="install-progress-labels">
                    <span>0%</span>
                    <span id="progress-percentage" aria-live="polite">0%</span>
                    <span>100%</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const progressBar = document.getElementById("progress-bar");
            const progressPercentage = document.getElementById("progress-percentage");
            const progressBarTrack = document.getElementById("progress-bar-track");
            const progressLine1 = document.getElementById("progress-line-1");
            const cancelInstallBtn = document.getElementById("cancel-install");
            const startInstallBtn = document.getElementById("start-install");
            const restartNowBtn = document.getElementById("restart-now");
            const slides = document.querySelectorAll(".slide-img");
            const totalSlide = slides.length;
            const captionEl = document.getElementById("slide-caption");
            let slideIndex = 0;

            function showSlide(index) {
                slides.forEach((img, i) => {
                    img.classList.toggle("active", i === index);
                });
                captionEl.textContent = slides[index].dataset.caption || "";
            }

            progressLine1.style.width = "100%";
            startProgress();

            function startProgress() {
                let progress = 0;
                const timer = setInterval(() => {
                    progress += 0.25;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(timer);
                        setTimeout(() => {
                            window.location.href = "oobe1.html";
                        }, 1200);
                    }
                    progressBar.style.width = progress + "%";
                    progressBarTrack.setAttribute("aria-valuenow", String(Math.round(progress)));
                    progressPercentage.textContent = Math.round(progress) + "%";

                    slideIndex = Math.min(Math.floor(progress / (100 / totalSlide)), totalSlide - 1);
                    showSlide(slideIndex);
                }, 90);
            }

            startInstallBtn.addEventListener("click", () => {
                document.getElementById("step-1").classList.remove("active");
                document.getElementById("step-2").classList.add("active");
                progressLine1.style.width = "100%";
                startProgress();
            });
            cancelInstallBtn.addEventListener("click", () => window.location.href = "stop.html");
            document.getElementById("cancel-btn").addEventListener("click", () => window.location.href = "stop.html");
            restartNowBtn.addEventListener("click", () => window.location.href = "oobe1.html");
        });
    </script>
</body>
</html>
