<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个性化设置</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body class="settings-layout theme-dark">

<div class="sidebar">
    <div class="sidebar-item active">
        <img src="personal.png" alt="">
        个性化
    </div>
    <div class="sidebar-item" onclick="window.location.href='apps.html'">
        <img src="apps.png" alt="">
        软件卸载
    </div>
    <div class="sidebar-item" onclick="window.location.href='account.html'">
        <img src="user.png" alt="">
        账户
    </div>
    <div class="sidebar-item" onclick="window.location.href='about.html'">
        <img src="about.svg" alt="">
        关于
    </div>
</div>

<div class="main">
    <h2 class="title">个性化</h2>
    <div class="box">
        <div class="row">当前主题：黑色</div>
        <button onclick="switchToWhite()">切换到白色主题</button>
    </div>
    <section class="wallpaper-settings">
        <h3>桌面壁纸</h3>
        <p class="wallpaper-description">点击图片或勾选轮播图片后会立即生效；调整间隔后自动保存。播放顺序按加入顺序排列，壁纸仅影响主桌面。</p>
        <div id="wallpaper-categories"></div>
        <div class="wallpaper-custom">
            <label for="wallpaper-url">壁纸路径 / URL（多张请用逗号分隔）</label>
            <div class="wallpaper-url-row">
                <input id="wallpaper-url" type="text" placeholder="./wallpaper/wildgoose/bg.jpg, ./wallpaper/wip12/WP12-LM.png">
            </div>
            <div class="wallpaper-url-row wallpaper-interval-row">
                <label for="wallpaper-interval">轮播间隔（秒）</label>
                <input id="wallpaper-interval" type="number" min="1" step="1" value="60">
            </div>
        </div>
    </section>
<section class="taskbar-settings">
    <h3>任务栏时钟</h3>
    <p class="wallpaper-description">时间下面固定显示日期。勾选后时间后面会带上秒，改动立即生效；对应的注册表变量是 wg_taskbar_time。</p>
    <div class="taskbar-toggle">
        <label for="taskbar-seconds"><input id="taskbar-seconds" type="checkbox">在时间中显示秒</label>
    </div>
</section>
</div>

<script src="../../wgui.js"></script>
<script src="settings-wallpaper.js"></script>
<script>
function switchToWhite() {
    localStorage.setItem("WG_color", "w");
    parent.postMessage({ action: "theme-change", theme: "w" }, "*");
    window.location.href = "personalized_w.html";
}

// 任务栏时钟 wg_taskbar_time：0 不显示秒，其余（含 1 和未设置）显示秒
(function () {
    const box = document.getElementById("taskbar-seconds");
    if (!box) return;
    let mode = null;
    try { mode = localStorage.getItem("wg_taskbar_time"); } catch (error) { mode = null; }
    box.checked = mode !== "0";
    box.addEventListener("change", function () {
        const value = box.checked ? "1" : "0";
        try { localStorage.setItem("wg_taskbar_time", value); } catch (error) {}
        parent.postMessage({ action: "taskbar-time-change", mode: value }, "*");
    });
})();
</script>
</body>
</html>
