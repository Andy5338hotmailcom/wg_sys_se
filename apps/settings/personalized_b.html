<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个性化设置</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body class="settings-layout theme-dark">

<div class="sidebar">
    <div class="sidebar-item active">
        <img src="personal.png" alt="">
        个性化
    </div>
    <div class="sidebar-item" onclick="window.location.href='apps.html'">
        <img src="apps.png" alt="">
        软件卸载
    </div>
    <div class="sidebar-item" onclick="window.location.href='account.html'">
        <img src="user.png" alt="">
        账户
    </div>
    <div class="sidebar-item" onclick="window.location.href='about.html'">
        <img src="about.svg" alt="">
        关于
    </div>
</div>

<div class="main">
    <h2 class="title">个性化</h2>
    <div class="box">
        <div class="row">当前主题：黑色</div>
        <button onclick="switchToWhite()">切换到白色主题</button>
    </div>
    <section class="wallpaper-settings">
        <h3>桌面壁纸</h3>
        <p class="wallpaper-description">点击图片即可应用；壁纸仅影响主桌面，不影响登录和安装页面。</p>
        <div id="wallpaper-categories"></div>
        <div class="wallpaper-custom">
            <label for="wallpaper-url">或输入图片路径 / URL</label>
            <div class="wallpaper-url-row">
                <input id="wallpaper-url" type="text" placeholder="./wallpaper/wildgoose/bg.jpg">
                <button id="apply-wallpaper-url" type="button">应用</button>
            </div>
        </div>
    </section>
</div>

<script src="settings-wallpaper.js"></script>
<script>
function switchToWhite() {
    localStorage.setItem("WG_color", "w");
    parent.postMessage({ action: "theme-change", theme: "w" }, "*");
    window.location.href = "personalized_w.html";
}
</script>
</body>
</html>
