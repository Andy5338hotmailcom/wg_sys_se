<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>账户设置</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body class="settings-layout theme-light">

<div class="sidebar">
    <div class="sidebar-item" onclick="window.location.href='personalized_w.html'">
        <img src="personal.png" alt="">
        个性化
    </div>
    <div class="sidebar-item" onclick="window.location.href='apps_w.html'">
        <img src="apps.png" alt="">
        软件卸载
    </div>
    <div class="sidebar-item active"">
        <img src="user.png" alt="">
        账户
    </div>
    <div class="sidebar-item" onclick="window.location.href='about_w.html'">
        <img src="about.svg" alt="">
        关于
    </div>
</div>

<!-- 核心内容：密码管理 -->
<div class="password-settings">
    <h2>密码管理</h2>
    
    <div class="password-field">
        <label for="new_pwd">设置新密码</label>
        <input 
            id="new_pwd" 
            type="password" 
            placeholder="请输入新密码"
        >
    </div>

    <div class="password-field confirm-password">
        <label for="confirm_pwd">确认新密码</label>
        <input 
            id="confirm_pwd" 
            type="password" 
            placeholder="请再次输入新密码"
        >
    </div>

    <!-- 按钮组 -->
    <div class="password-actions">
        <button 
            onclick="savePassword()"
        >
            保存密码
        </button>
        <button 
            onclick="removePassword()"
            class="remove-password"
        >
            无密码
        </button>
    </div>
</div>

<script>
// 哈希加密
function hash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        let chr = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + chr;
        hash |= 0;
    }
    return Math.abs(hash).toString(16);
}

// 保存密码
function savePassword() {
    let p1 = document.getElementById("new_pwd").value;
    let p2 = document.getElementById("confirm_pwd").value;
    
    if (!p1 || !p2) {
        alert("请填写完整");
        return;
    }
    
    if (p1 !== p2) {
        alert("两次输入不一致");
        return;
    }

    let hashedPwd = hash(p1);
    localStorage.setItem("wg_login_hash", hashedPwd);
    
    alert("✅ 密码设置成功！");
    
    document.getElementById("new_pwd").value = "";
    document.getElementById("confirm_pwd").value = "";
}

// 无密码 —— 清除密码（你要的功能！）
function removePassword() {
    if(confirm("确定要关闭密码登录吗？")){
        localStorage.removeItem("wg_login_hash");
        alert("✅ 已关闭密码，当前无密码保护");
    }
}
</script>

<script>
function switchToBlack() {
    localStorage.setItem("WG_color", "b");
    window.location.href = "personalized_b.html";
}
</script>
</body>
</html>
