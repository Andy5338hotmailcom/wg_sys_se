<!-- 核心内容：密码管理 -->
<div style="padding: 30px; max-width: 500px; margin: 0 auto;">
    <h2 style="font-size: 24px; margin-bottom: 24px;">密码管理</h2>
    
    <div style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 6px; font-size: 14px;">设置新密码</label>
        <input 
            id="new_pwd" 
            type="password" 
            placeholder="请输入新密码"
            style="width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none;"
        >
    </div>

    <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 6px; font-size: 14px;">确认新密码</label>
        <input 
            id="confirm_pwd" 
            type="password" 
            placeholder="请再次输入新密码"
            style="width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none;"
        >
    </div>

    <!-- 按钮组 -->
    <div style="display: flex; gap: 12px;">
        <button 
            onclick="savePassword()"
            style="flex:1; padding: 10px 18px; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px;"
        >
            保存密码
        </button>
        <button 
            onclick="removePassword()"
            style="flex:1; padding: 10px 18px; background: #666; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px;"
        >
            无密码
        </button>
    </div>
</div>

<script>
// 哈希加密
function hash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        let chr = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + chr;
        hash |= 0;
    }
    return Math.abs(hash).toString(16);
}

// 保存密码
function savePassword() {
    let p1 = document.getElementById("new_pwd").value;
    let p2 = document.getElementById("confirm_pwd").value;
    
    if (!p1 || !p2) {
        alert("请填写完整");
        return;
    }
    
    if (p1 !== p2) {
        alert("两次输入不一致");
        return;
    }

    let hashedPwd = hash(p1);
    localStorage.setItem("wg_login_hash", hashedPwd);
    
    alert("✅ 密码设置成功！");
    
    document.getElementById("new_pwd").value = "";
    document.getElementById("confirm_pwd").value = "";
}

// 无密码 —— 清除密码（你要的功能！）
function removePassword() {
    if(confirm("确定要关闭密码登录吗？")){
        localStorage.removeItem("wg_login_hash");
        alert("✅ 已关闭密码，当前无密码保护");
    }
}
</script>

<script>
function switchToWhite() {
    localStorage.setItem("WG_color", "w");

}
</script>
