<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个性化设置</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body class="settings-layout theme-light">

    <div class="sidebar">
        <div class="sidebar-item active">
            <img src="personal.png" alt="">
            个性化
        </div>
        <div class="sidebar-item" onclick="window.location.href='apps_w.html'">
            <img src="apps.png" alt="">
            软件卸载
        </div>
        <div class="sidebar-item" onclick="window.location.href='account_w.html'">
            <img src="user.png" alt="">
            账户
        </div>
        <div class="sidebar-item" onclick="window.location.href='about_w.html'">
            <img src="about.svg" alt="">
            关于
        </div>
    </div>

    <div class="main">
        <h2 class="title">个性化</h2>
        <div class="box">
            <div class="row">当前主题：白色</div>
            <button onclick="switchToBlack()">切换到黑色主题</button>
        </div>
    </div>

    <script>
function switchToBlack() {
    localStorage.setItem("WG_color", "b");
    parent.postMessage({ action: "theme-change", theme: "b" }, "*");
    window.location.href = "personalized_b.html";
}
    </script>
</body>
</html>
