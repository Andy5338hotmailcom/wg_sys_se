<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="连接中心">
  <rect rx="12" width="100" height="100" fill="#C8BFE7"/>

  <!-- 星型拓扑：中心节点 + 四个外围节点 -->
  <g stroke="#7563A6" stroke-width="3.5" stroke-linecap="round">
    <line x1="35.5" y1="35.5" x2="45.5" y2="45.5"/>
    <line x1="64.5" y1="35.5" x2="54.5" y2="45.5"/>
    <line x1="35.5" y1="64.5" x2="45.5" y2="54.5"/>
    <line x1="64.5" y1="64.5" x2="54.5" y2="54.5"/>
  </g>

  <circle cx="50" cy="50" r="9" fill="#fff"/>
  <circle cx="50" cy="50" r="4" fill="#7563A6"/>

  <circle cx="28" cy="28" r="7" fill="#fff"/>
  <circle cx="72" cy="28" r="7" fill="#fff"/>
  <circle cx="28" cy="72" r="7" fill="#fff"/>
  <circle cx="72" cy="72" r="7" fill="#fff"/>
</svg>
