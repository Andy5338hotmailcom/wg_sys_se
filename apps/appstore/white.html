<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>软件商店</title>
    <script src="../../wgui.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #ffffff;
            color: #111;
            height: 100vh;
            overflow: hidden;
        }

        .layout {
            display: flex;
            height: 100vh;
        }

        .content {
            flex: 1;
            min-width: 0;
            padding: 20px;
            overflow-y: auto;
        }

        /* 搜索栏 */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #ddd;
            background: #f5f7fa;
            color: #333;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        /* 左侧导航 */
        .sidebar {
            flex: 0 0 200px;
            background: #f5f7fa;
            border-right: 1px solid #e6e9ef;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-title {
            font-size: 15px;
            font-weight: bold;
            padding: 6px 14px 14px;
            color: #111;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #444;
            user-select: none;
        }

        .nav-item:hover {
            background: #e9edf3;
        }

        .nav-item.active {
            background: #5a67ff;
            color: #fff;
        }

        .nav-icon {
            font-size: 15px;
            line-height: 1;
        }

        /* 应用列表网格 */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        /* 应用卡片 */
        .app-card {
            background: #f9fafb;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
        }

        .app-name {
            font-size: 16px;
            font-weight: bold;
        }

        .app-category {
            font-size: 12px;
            color: #555;
            background: #eef1f5;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        /* 按钮 */
        .install-btn {
            padding: 8px;
            border-radius: 8px;
            border: none;
            background: #5a67ff;
            color: white;
            cursor: pointer;
            margin-top: auto;
        }
        .open-btn {
            background: #28a745;
        }
        .uninstall-btn {
            background: #ff4a66;
        }
        .installed-label {
            font-size: 12px;
            color: #4caf50;
        }

        /* 窗口变窄：侧栏改为图标在上、文字在下 */
        @media (max-width: 560px) {
            .sidebar {
                flex: 0 0 86px;
                padding: 12px 8px;
                overflow-y: auto;
            }

            .sidebar-title {
                font-size: 12px;
                text-align: center;
                padding: 0 0 10px;
            }

            .nav-item {
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 5px;
                padding: 9px 2px;
                font-size: 11px;
                line-height: 1.15;
                text-align: center;
            }

            .nav-icon {
                font-size: 24px;
            }

            .content {
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-title">软件商店</div>
            <div class="nav-item active" onclick="switchTab('store')"><span class="nav-icon">🧩</span>应用</div>
            <div class="nav-item" onclick="switchTab('manage')"><span class="nav-icon">🗑</span>卸载</div>
            <div class="nav-item" onclick="switchTab('wgapp')"><span class="nav-icon">📦</span>安装 Wgapp</div>
        </aside>
        <main class="content">
            <input type="text" class="search-box" id="search" placeholder="搜索应用..." oninput="searchApp()">
            <div class="app-grid" id="app-container"></div>
        </main>
    </div>

    <script>
        // ==============================
        // 【商店应用库】格式和 app_list 完全一致
        // ==============================
        const STORE_APPS = [
            {"id":"wg_calculator","name":"计算器","icon":"ico/calculator.svg","path":"apps/calculator/index.html","color":"#C7BEE6","category":"工具","developer":"Wildgoose"},
            { id: "win12web", name: "Windows 12 网页版", icon: "ico/win12web.png", path: "https://win12-online.github.io/win12/boot.html", category: "开发者：tjy-github 类别：模拟" },
            { id: "winxpweb", name: "Windows xp 网页版", icon: "ico/winxpweb.png", path: "https://win32.run/", category: "开发者：win32.run 类别：模拟" },
            { id: "wildgoose", name: "Wildgoose 沙盒", icon: "icon.png", path: "index.html", category: "开发者：Wildgoose 类别：模拟" },
            { id: "wgsysoffice", name: "Wildgoose Office", icon: "ico/wgsysoffice.png", path: "apps/wgsysoffice/office.html", category: "开发者：Wildgoose 类别：办公 " },
            { id: "src", name: "学生点名系统", icon: "ico/src.ico", path: "apps/src/index.html", category: "开发者：Wildgoose 类别：教育 " }
        ];

        let currentTab = "store";

        // ==============================
        // 读取本地已安装应用
        // ==============================
        function getLocalApps() {
            try {
                return JSON.parse(localStorage.getItem("app_list")) || [];
            } catch (e) {
                return [];
            }
        }

        // ==============================
        // 保存到本地
        // ==============================
        function saveLocalApps(list) {
            localStorage.setItem("app_list", JSON.stringify(list));
        }

        // ==============================
        // 安装应用
        // ==============================
        async function installApp(id) {
            const local = getLocalApps();
            const app = STORE_APPS.find(a => a.id === id);
            if (!app) return;

            const exists = local.some(i => i.id === id);
            if (exists) {
                await WGUI.alert({ title: "应用商店", message: "已安装！", type: "info" });
                return;
            }

            local.push(app);
            saveLocalApps(local);
            render();
            await WGUI.alert({ title: "安装成功", message: "应用已安装。", type: "success" });
        }

        // ==============================
        // 卸载应用
        // ==============================
        async function uninstallApp(id) {
            if (!await WGUI.confirm({ title: "卸载应用", message: "确定卸载？" })) return;
            let local = getLocalApps();
            local = local.filter(i => i.id !== id);
            saveLocalApps(local);
            render();
            await WGUI.alert({ title: "卸载成功", message: "应用已卸载。", type: "success" });
        }

        // ==============================
        // 【通用】打开应用（postMessage）
        // ==============================
        function openAppFromStore(appId) {
            console.log("准备打开应用：", appId);
            parent.postMessage({
                action: "openApp",
                appId: appId
            }, "*");
        }

        // ==============================
        // 渲染页面
        // ==============================
        function render() {
            const container = document.getElementById("app-container");
            container.innerHTML = "";
            const local = getLocalApps();
            const keyword = document.getElementById("search").value.toLowerCase();

            let list = [];
            if (currentTab === "store") list = STORE_APPS;
            else if (currentTab === "manage") list = local;

            // 搜索过滤
            list = list.filter(a => a.name.toLowerCase().includes(keyword) || a.id.includes(keyword));

            list.forEach(app => {
                const installed = local.some(i => i.id === app.id);
                const card = document.createElement("div");
                card.className = "app-card";

                let btnHtml = "";
                if (installed) {
                    if(currentTab === "manage"){
                        btnHtml = `
                            <button class="install-btn open-btn" onclick="openAppFromStore('${app.id}')">打开</button>
                            <button class="install-btn uninstall-btn" onclick="uninstallApp('${app.id}')">卸载</button>
                        `;
                    }else{
                        btnHtml = `<button class="install-btn open-btn" onclick="openAppFromStore('${app.id}')">打开</button>`;
                    }
                } else {
                    btnHtml = `<button class="install-btn" onclick="installApp('${app.id}')">安装</button>`;
                }

                card.innerHTML = `
                    <img src="${app.icon}" class="app-icon">
                    <div class="app-name">${app.name}</div>
                    <div class="app-category">${app.category || "未分类"}</div>
                    ${installed ? '<span class="installed-label">已安装</span>' : ''}
                    ${btnHtml}
                `;
                container.appendChild(card);
            });
        }

        // ==============================
        // 切换选项卡
        // ==============================
        function switchTab(tab) {
            if (tab === "wgapp") {
                openAppFromStore("appinstall");
                return;
            }

            currentTab = tab;
            const items = document.querySelectorAll(".nav-item");
            items.forEach(t => t.classList.remove("active"));
            const index = tab === "store" ? 0 : 1;
            if (items[index]) items[index].classList.add("active");
            render();
        }

        // ==============================
        // 搜索
        // ==============================
        function searchApp() { render(); }

        // 初始化
        window.onload = render;
    </script>
</body>
</html>
