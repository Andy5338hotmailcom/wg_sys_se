<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wildgoose Browser</title>
<style>
* {
    box-sizing: border-box;
    margin:0;
    padding:0;
    font-family: system-ui, -apple-system, sans-serif;
}
body{
    background:#fff;
    color:#111;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
/* 标签栏 */
.tabbar{
    display:flex;
    gap:4px;
    padding:4px 6px;
    background:#eee;
    overflow-x:auto;
    align-items:center;
}
.tab{
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:6px 6px 0 0;
    background:#ddd;
    min-width:120px;
    max-width:180px;
    cursor:pointer;
}
.tab.active{
    background:#fff;
}
.tab-title{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    font-size:0.85rem;
}
.tab-close{
    width:18px;
    height:18px;
    border-radius:99px;
    border:none;
    background:#bbb;
    color:#000;
    cursor:pointer;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.tab-new{
    width:26px;
    height:26px;
    border:none;
    background:#ddd;
    border-radius:4px;
    cursor:pointer;
    font-size:18px;
}
/* 顶部导航栏 */
.topbar{
    display:flex;
    gap:6px;
    padding:6px 8px;
    align-items:center;
    border-bottom:1px solid #ddd;
}
.topbar button{
    border:none;
    border-radius:4px;
    padding:4px 8px;
    cursor:pointer;
    background:#eee;
}
#addr{
    flex:1;
    padding:6px 10px;
    border:1px solid #ccc;
    border-radius:6px;
}
/* iframe容器 */
#frameWrap{
    flex:1;
    width:100%;
    position:relative;
}
#webview{
    width:100%;
    height:100%;
    border:none;
}
/* 新标签页 */
.newtab{
    position:absolute;
    inset:0;
    background:#fff;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:32px;
}
.newtab h1{
    font-size:32px;
    font-weight:normal;
}
.newtab-search{
    width: min(600px,90%);
}
.newtab-search input{
    width:100%;
    padding:14px 18px;
    border-radius:999px;
    border:1px solid #ccc;
    font-size:1rem;
}
</style>
</head>
<body>
<div class="tabbar" id="tabBar">
    <button class="tab-new" onclick="newTab()">+</button>
</div>

<div class="topbar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button onclick="reload()">⟳</button>
    <button onclick="goHome()">🏠</button>
    <input id="addr" placeholder="输入网址，按回车访问" onkeydown="if(event.key==='Enter')navigate()">
    <button onclick="navigate()">前往</button>
    <button onclick="newTab('wgbrowser:about')">关于</button>
</div>

<div id="frameWrap">
    <iframe id="webview" src="about:blank"></iframe>
    <div class="newtab" id="newTabPage">
        <h1>Wildgoose 浏览器</h1>
        <div class="newtab-search">
            <input id="newTabInput" placeholder="搜索或输入网址" onkeydown="if(event.key==='Enter')navigateFromNewTab()">
        </div>
    </div>
</div>

<script>
const iframe = document.getElementById("webview");
const addrInput = document.getElementById("addr");
const tabBar = document.getElementById("tabBar");
const newTabPage = document.getElementById("newTabPage");
const newTabInput = document.getElementById("newTabInput");

let tabs = [];
let activeTabId = null;
let tabIdCounter = 1;
const NEWTAB_SIGN = "wgbrowser:newtab";

function showNewTab() {
    iframe.style.display = "none";
    newTabPage.style.display = "flex";
}
function hideNewTab() {
    iframe.style.display = "block";
    newTabPage.style.display = "none";
}

// 创建标签【修复版本】
function newTab(url = NEWTAB_SIGN) {
    const tid = tabIdCounter++;
    let iframeSrc = url;
    if(url === NEWTAB_SIGN) iframeSrc = "";
    const tabData = {
        id: tid,
        title: url,
        url: url,
        iframeSrc: iframeSrc,
        historyStack: [],
        historyIndex: -1
    };
    tabData.historyStack.push({url:url, iframeSrc:iframeSrc});
    tabData.historyIndex = 0;
    tabs.push(tabData);
    renderTabs();
    switchTab(tid);
    // 重点修复：如果不是空白新标签，自动解析加载url
    if(url !== NEWTAB_SIGN) {
        loadUrl(tid, url);
    }
}

// 渲染标签栏
function renderTabs(){
    const newTabBtn = tabBar.querySelector(".tab-new");
    tabBar.innerHTML = "";
    tabBar.appendChild(newTabBtn);
    tabs.forEach(tab=>{
        const div = document.createElement("div");
        div.className = "tab" + (tab.id === activeTabId ? " active" : "");
        div.onclick = (e)=>{
            if(!e.target.classList.contains("tab-close")) switchTab(tab.id);
        };
        div.innerHTML = `
            <span class="tab-title">${tab.url}</span>
            <button class="tab-close" onclick="closeTab(${tab.id})">×</button>
        `;
        tabBar.insertBefore(div, newTabBtn);
    })
}

// 切换标签
function switchTab(tid){
    const tab = tabs.find(t=>t.id === tid);
    if(!tab) return;
    activeTabId = tid;
    addrInput.value = tab.url;
    if(tab.url === NEWTAB_SIGN){
        showNewTab();
    }else{
        hideNewTab();
        iframe.src = tab.iframeSrc;
    }
    renderTabs();
}

// 关闭标签
function closeTab(tid){
    if(tabs.length <= 1) return;
    const idx = tabs.findIndex(t=>t.id===tid);
    tabs.splice(idx,1);
    if(activeTabId === tid){
        const newActive = tabs[Math.max(0, idx-1)];
        activeTabId = newActive.id;
        switchTab(activeTabId);
    }else{
        renderTabs();
    }
}

// 地址栏跳转
function navigate(){
    let rawUrl = addrInput.value.trim();
    if(!rawUrl) return;
    loadUrl(activeTabId, rawUrl);
}
function navigateFromNewTab(){
    const rawUrl = newTabInput.value.trim();
    if(!rawUrl) return;
    loadUrl(activeTabId, rawUrl);
    newTabInput.value = "";
}

function loadUrl(tid, rawUrl){
    const tab = tabs.find(t=>t.id === tid);
    if(!tab) return;
    let displayUrl = rawUrl;
    let iframeSrc = rawUrl;

    // 自定义协议优先解析
    if(rawUrl.startsWith("wgbrowser:")){
        const cmd = rawUrl.replace("wgbrowser:","").toLowerCase();
        if(cmd === "newtab"){
            newTab(NEWTAB_SIGN);
            return;
        }
        if(cmd === "about"){
            displayUrl = "wgbrowser:about";
            iframeSrc = "./about.html";
        }
    }
    if(rawUrl.startsWith("wgbrowserfiles:")){
        displayUrl = rawUrl;
        const filePath = rawUrl.replace("wgbrowserfiles:","");
        iframeSrc = "./" + filePath;
    }

    if(displayUrl === NEWTAB_SIGN){
        tab.historyStack.splice(tab.historyIndex+1);
        tab.historyStack.push({url:displayUrl, iframeSrc:""});
        tab.historyIndex = tab.historyStack.length -1;
        tab.url = displayUrl;
        tab.iframeSrc = "";
        addrInput.value = tab.url;
        showNewTab();
        renderTabs();
        return;
    }

    // 自定义协议，跳过搜索
    if(rawUrl.startsWith("wgbrowser:") || rawUrl.startsWith("wgbrowserfiles:")){
        tab.historyStack.splice(tab.historyIndex+1);
        tab.historyStack.push({url:displayUrl, iframeSrc:iframeSrc});
        tab.historyIndex = tab.historyStack.length -1;
        tab.url = displayUrl;
        tab.iframeSrc = iframeSrc;
        addrInput.value = tab.url;
        hideNewTab();
        iframe.src = iframeSrc;
        renderTabs();
        return;
    }

    // 普通网址/搜索
    const isUrl = /^(https?:\/\/)|(\.[a-zA-Z0-9-]+\.[a-zA-Z]{2,})/.test(rawUrl);
    if(!isUrl){
        iframeSrc = "https://www.bing.com/search?q=" + encodeURIComponent(rawUrl);
    }else if(!/^https?:\/\//.test(rawUrl)){
        iframeSrc = "https://"+rawUrl;
    }
    displayUrl = rawUrl;

    tab.historyStack.splice(tab.historyIndex+1);
    tab.historyStack.push({url:displayUrl, iframeSrc:iframeSrc});
    tab.historyIndex = tab.historyStack.length -1;
    tab.url = displayUrl;
    tab.iframeSrc = iframeSrc;
    addrInput.value = tab.url;
    hideNewTab();
    iframe.src = iframeSrc;
    renderTabs();
}

function goBack(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(!tab || tab.historyIndex <= 0) return;
    tab.historyIndex--;
    const entry = tab.historyStack[tab.historyIndex];
    tab.url = entry.url;
    tab.iframeSrc = entry.iframeSrc;
    addrInput.value = tab.url;
    if(tab.url === NEWTAB_SIGN) showNewTab();
    else {hideNewTab(); iframe.src = tab.iframeSrc;}
    renderTabs();
}
function goForward(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(!tab || tab.historyIndex >= tab.historyStack.length-1) return;
    tab.historyIndex++;
    const entry = tab.historyStack[tab.historyIndex];
    tab.url = entry.url;
    tab.iframeSrc = entry.iframeSrc;
    addrInput.value = tab.url;
    if(tab.url === NEWTAB_SIGN) showNewTab();
    else {hideNewTab(); iframe.src = tab.iframeSrc;}
    renderTabs();
}
function reload(){
    const tab = tabs.find(t=>t.id === activeTabId);
    if(!tab || tab.url === NEWTAB_SIGN) return;
    iframe.src = tab.iframeSrc;
}
function goHome(){
    loadUrl(activeTabId, NEWTAB_SIGN);
}

// 初始化
newTab(NEWTAB_SIGN);
</script>
</body>
</html>
