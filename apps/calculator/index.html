<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family:system-ui, sans-serif;
        }
        body{
            background:var(--wg-bg,#ffffff);
            color:var(--wg-text,#111);
            height:100vh;
            padding:16px;
            display:flex;
            flex-direction:column;
        }
        #display{
            font-size:2.2rem;
            text-align:right;
            padding:12px 8px;
            border:none;
            outline:none;
            background:transparent;
            color:inherit;
            margin-bottom:12px;
        }
        .btn-grid{
            display:grid;
            grid-template-columns: repeat(4,1fr);
            gap:8px;
            flex:1;
        }
        button{
            font-size:1.2rem;
            border:none;
            border-radius:8px;
            padding:12px;
            cursor:pointer;
            background:var(--wg-btn,#e8e8e8);
            color:inherit;
        }
        button.opt{
            background:#348ede;
            color:white;
        }
        button.clear{
            background:#dd4444;
            color:white;
        }
    </style>
</head>
<body>
    <input type="text" id="display" readonly value="">
    <div class="btn-grid">
        <button class="clear" onclick="clearAll()">C</button>
        <button onclick="appendChar('(')">(</button>
        <button onclick="appendChar(')')">)</button>
        <button class="opt" onclick="appendChar('/')">/</button>

        <button onclick="appendChar('7')">7</button>
        <button onclick="appendChar('8')">8</button>
        <button onclick="appendChar('9')">9</button>
        <button class="opt" onclick="appendChar('*')">×</button>

        <button onclick="appendChar('4')">4</button>
        <button onclick="appendChar('5')">5</button>
        <button onclick="appendChar('6')">6</button>
        <button class="opt" onclick="appendChar('-')">-</button>

        <button onclick="appendChar('1')">1</button>
        <button onclick="appendChar('2')">2</button>
        <button onclick="appendChar('3')">3</button>
        <button class="opt" onclick="appendChar('+')">+</button>

        <button onclick="appendChar('0')">0</button>
        <button onclick="appendChar('.')">.</button>
        <button onclick="backspace()">⌫</button>
        <button class="opt" onclick="calcResult()">=</button>
    </div>

<script>
const disp = document.getElementById("display");

function normalizeExpression(input){
    return input.replace(/×/g, "*").replace(/÷/g, "/").replace(/\s+/g, "");
}

function formatNumber(value){
    if (!Number.isFinite(value)) {
        throw new Error("非有限值");
    }
    if (Math.abs(value) < 1e-12) {
        value = 0;
    }
    const rounded = Number(value.toFixed(12));
    return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1");
}

function calcExpression(input){
    const exp = normalizeExpression(input);
    if (!exp || !/^[0-9+\-*/().]+$/.test(exp)) {
        throw new Error("非法表达式");
    }

    let index = 0;

    function parseNumber(){
        const start = index;
        let dotSeen = false;

        while (index < exp.length) {
            const ch = exp[index];
            if (/[0-9]/.test(ch)) {
                index += 1;
            } else if (ch === "." && !dotSeen) {
                dotSeen = true;
                index += 1;
            } else {
                break;
            }
        }

        const numText = exp.slice(start, index);
        if (!numText || numText === ".") {
            throw new Error("非法数字");
        }
        return Number(numText);
    }

    function parsePrimary(){
        if (index >= exp.length) {
            throw new Error("表达式不完整");
        }

        const ch = exp[index];
        if (ch === "+" || ch === "-") {
            const sign = ch === "-" ? -1 : 1;
            index += 1;
            return sign * parsePrimary();
        }

        if (ch === "(") {
            index += 1;
            const value = parseAddSub();
            if (exp[index] !== ")") {
                throw new Error("括号不匹配");
            }
            index += 1;
            return value;
        }

        if (/[0-9.]/.test(ch)) {
            return parseNumber();
        }

        throw new Error("非法字符");
    }

    function parseMulDiv(){
        let value = parsePrimary();

        while (index < exp.length) {
            const ch = exp[index];
            if (ch !== "*" && ch !== "/") {
                break;
            }
            index += 1;
            const rhs = parsePrimary();
            if (ch === "/") {
                if (rhs === 0) {
                    throw new Error("除数不能为0");
                }
                value = value / rhs;
            } else {
                value = value * rhs;
            }
        }

        return value;
    }

    function parseAddSub(){
        let value = parseMulDiv();

        while (index < exp.length) {
            const ch = exp[index];
            if (ch !== "+" && ch !== "-") {
                break;
            }
            index += 1;
            const rhs = parseMulDiv();
            value = ch === "+" ? value + rhs : value - rhs;
        }

        return value;
    }

    const result = parseAddSub();
    if (index !== exp.length) {
        throw new Error("表达式非法");
    }
    return result;
}

function appendChar(c){
    disp.value += c;
}
function clearAll(){
    disp.value = "";
}
function backspace(){
    disp.value = disp.value.slice(0,-1);
}
function calcResult(){
    try{
        const res = calcExpression(disp.value);
        disp.value = formatNumber(res);
    }catch(e){
        disp.value = "错误";
    }
}
</script>
</body>
</html>
