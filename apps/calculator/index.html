<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family:system-ui, sans-serif;
        }
        body{
            background:var(--wg-bg,#ffffff);
            color:var(--wg-text,#111);
            height:100vh;
            padding:16px;
            display:flex;
            flex-direction:column;
        }
        #display{
            font-size:2.2rem;
            text-align:right;
            padding:12px 8px;
            border:none;
            outline:none;
            background:transparent;
            color:inherit;
            margin-bottom:12px;
        }
        .btn-grid{
            display:grid;
            grid-template-columns: repeat(4,1fr);
            gap:8px;
            flex:1;
        }
        button{
            font-size:1.2rem;
            border:none;
            border-radius:8px;
            padding:12px;
            cursor:pointer;
            background:var(--wg-btn,#e8e8e8);
            color:inherit;
        }
        button.opt{
            background:#348ede;
            color:white;
        }
        button.clear{
            background:#dd4444;
            color:white;
        }
        button.eq{
            grid-row: span 2;
        }
        button:active{
            transform: scale(0.96);
            filter: brightness(0.9);
        }
        @media (hover: hover){
            button:hover{
                filter: brightness(1.06);
            }
        }
    </style>
</head>
<body>
    <input type="text" id="display" readonly value="" aria-label="计算器显示" aria-live="polite">
    <div class="btn-grid">
        <button type="button" class="clear" onclick="clearAll()">C</button>
        <button type="button" onclick="clearEntry()">CE</button>
        <button type="button" onclick="toggleSign()">±</button>
        <button type="button" onclick="appendPercent()">%</button>

        <button type="button" onclick="appendChar('(')">(</button>
        <button type="button" onclick="appendChar(')')">)</button>
        <button type="button" class="opt" onclick="appendChar('/')">÷</button>
        <button type="button" class="opt" onclick="appendChar('*')">×</button>

        <button type="button" onclick="appendChar('7')">7</button>
        <button type="button" onclick="appendChar('8')">8</button>
        <button type="button" onclick="appendChar('9')">9</button>
        <button type="button" class="opt" onclick="appendChar('-')">-</button>

        <button type="button" onclick="appendChar('4')">4</button>
        <button type="button" onclick="appendChar('5')">5</button>
        <button type="button" onclick="appendChar('6')">6</button>
        <button type="button" class="opt" onclick="appendChar('+')">+</button>

        <button type="button" onclick="appendChar('1')">1</button>
        <button type="button" onclick="appendChar('2')">2</button>
        <button type="button" onclick="appendChar('3')">3</button>
        <button type="button" class="opt eq" onclick="calcResult()">=</button>

        <button type="button" onclick="appendChar('0')">0</button>
        <button type="button" onclick="appendChar('.')">.</button>
        <button type="button" onclick="backspace()" aria-label="退格">⌫</button>
    </div>

<script>
const disp = document.getElementById("display");
let justEvaluated = false;
let errorState = false;

function isOperator(ch){
    return /[+\-*/]/.test(ch);
}

function normalizeExpression(input){
    return input.replace(/×/g, "*").replace(/÷/g, "/").replace(/\s+/g, "");
}

function formatNumber(value){
    if (!Number.isFinite(value)) {
        throw new Error("非有限值");
    }
    if (Math.abs(value) < 1e-12) {
        value = 0;
    }
    const rounded = Number(value.toFixed(12));
    return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/\.0+$/, "").replace(/(\.\d*?)0+$/, "$1");
}

function calcExpression(input){
    const exp = normalizeExpression(input);
    if (!exp || !/^[0-9+\-*/().]+$/.test(exp)) {
        throw new Error("非法表达式");
    }

    let index = 0;

    function parseNumber(){
        const start = index;
        let dotSeen = false;

        while (index < exp.length) {
            const ch = exp[index];
            if (/[0-9]/.test(ch)) {
                index += 1;
            } else if (ch === "." && !dotSeen) {
                dotSeen = true;
                index += 1;
            } else {
                break;
            }
        }

        const numText = exp.slice(start, index);
        if (!numText || numText === ".") {
            throw new Error("非法数字");
        }
        return Number(numText);
    }

    function parsePrimary(){
        if (index >= exp.length) {
            throw new Error("表达式不完整");
        }

        const ch = exp[index];
        if (ch === "+" || ch === "-") {
            const sign = ch === "-" ? -1 : 1;
            index += 1;
            return sign * parsePrimary();
        }

        if (ch === "(") {
            index += 1;
            const value = parseAddSub();
            if (exp[index] !== ")") {
                throw new Error("括号不匹配");
            }
            index += 1;
            return value;
        }

        if (/[0-9.]/.test(ch)) {
            return parseNumber();
        }

        throw new Error("非法字符");
    }

    function parseMulDiv(){
        let value = parsePrimary();

        while (index < exp.length) {
            const ch = exp[index];
            if (ch !== "*" && ch !== "/") {
                break;
            }
            index += 1;
            const rhs = parsePrimary();
            if (ch === "/") {
                if (rhs === 0) {
                    throw new Error("除数不能为0");
                }
                value = value / rhs;
            } else {
                value = value * rhs;
            }
        }

        return value;
    }

    function parseAddSub(){
        let value = parseMulDiv();

        while (index < exp.length) {
            const ch = exp[index];
            if (ch !== "+" && ch !== "-") {
                break;
            }
            index += 1;
            const rhs = parseMulDiv();
            value = ch === "+" ? value + rhs : value - rhs;
        }

        return value;
    }

    const result = parseAddSub();
    if (index !== exp.length) {
        throw new Error("表达式非法");
    }
    return result;
}

function appendChar(c){
    if (errorState) {
        disp.value = "";
        errorState = false;
    }

    if (justEvaluated && /[0-9.]/.test(c)) {
        disp.value = "";
        justEvaluated = false;
    }

    if (justEvaluated && isOperator(c)) {
        justEvaluated = false;
    }

    // 前导零：整串为 0 或运算符后紧跟单个 0 时，先吃掉那个 0
    if (/(^|[+\-*/(])0$/.test(disp.value) && /[0-9]/.test(c) && c !== "0") {
        disp.value = disp.value.slice(0, -1);
    }

    disp.value += c;
}

function clearAll(){
    disp.value = "";
    justEvaluated = false;
    errorState = false;
}

function clearEntry(){
    if (errorState) {
        clearAll();
        return;
    }
    // 只清除当前输入的最后一个操作数，保留前面的表达式（12+3 → 12+）
    disp.value = disp.value.replace(/(\d+(?:\.\d*)?|\.\d+)$/, "");
    justEvaluated = false;
}

function backspace(){
    if (errorState) {
        clearAll();
        return;
    }
    if (justEvaluated) {
        clearAll();
        return;
    }
    disp.value = disp.value.slice(0, -1);
}

function toggleSign(){
    if (!disp.value || errorState) {
        return;
    }

    if (justEvaluated) {
        const current = Number(disp.value);
        disp.value = formatNumber(-current);
        return;
    }

    if (/^-?[0-9.]+$/.test(disp.value)) {
        disp.value = disp.value.startsWith("-") ? disp.value.slice(1) : "-" + disp.value;
        return;
    }

    disp.value = `-(${disp.value})`;
}

function appendPercent(){
    const expr = disp.value;
    if (!expr || errorState) {
        return;
    }

    const match = /(-?\d+(?:\.\d*)?|\.\d+)$/.exec(expr);
    if (!match) {
        return;
    }

    const source = match[0];
    const percentValue = Number(source) / 100;
    disp.value = expr.slice(0, match.index) + formatNumber(percentValue);
    justEvaluated = false;
}

function calcResult(){
    if (!disp.value || errorState) {
        return;
    }

    try{
        const res = calcExpression(disp.value);
        disp.value = formatNumber(res);
        justEvaluated = true;
        errorState = false;
    }catch(e){
        disp.value = e.message || "错误";
        errorState = true;
        justEvaluated = false;
    }
}

document.addEventListener("keydown", function (event) {
    const key = event.key;

    if (/^[0-9]$/.test(key)) {
        event.preventDefault();
        appendChar(key);
        return;
    }

    if (key === ".") {
        event.preventDefault();
        appendChar(".");
        return;
    }

    if (key === "(" || key === ")") {
        event.preventDefault();
        appendChar(key);
        return;
    }

    if (["+", "-", "*", "/"].includes(key) || key === "x" || key === "X") {
        event.preventDefault();
        appendChar(key === "x" || key === "X" ? "*" : key);
        return;
    }

    if (key === "Enter" || key === "=") {
        event.preventDefault();
        calcResult();
        return;
    }

    if (key === "Backspace") {
        event.preventDefault();
        backspace();
        return;
    }

    if (key === "Delete" || key === "Escape") {
        event.preventDefault();
        clearAll();
        return;
    }

    if (key === "%") {
        event.preventDefault();
        appendPercent();
        return;
    }
});
</script>
</body>
</html>
