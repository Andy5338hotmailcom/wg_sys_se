<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>关于Wildgoose</title>
    <script src="version.js"></script>
    <script src="lang.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI",sans-serif;
        }
        body {
            background: #1a1a1a;
            color: #fff;
            padding: 35px 20px;
            text-align: center;
        }
        .title {
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .text {
            color: #999;
            margin-bottom: 35px;
        }
        .info-box {
            background: #222;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin: 0 auto 30px;
            max-width: 320px;
        }
        .info-box p {
            margin: 8px 0;
            font-size: 14px;
        }
        button {
            background: #5c68f8;
            border: none;
            color: #fff;
            padding: 6px 24px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="title" data-wg-i18n="appTitle">Wildgoose SE</div>
    <div class="text" data-wg-i18n="osVersionTitle">操作系统 版本信息</div>

    <div class="info-box">
        <p data-wg-i18n="editionLine">Wildgoose Second Edition Preview</p>
        <p><span data-wg-i18n="versionLabel">版本：</span>26H11A</p>
        <p><span data-wg-i18n="buildLabel">内部版本：</span><span data-wg-build></span></p>
    </div>

    <script>
        (function () {
            var store = window.WG_LANG || {};
            var lang = localStorage.getItem("wg_lang") || "zh-cn";
            var dict = store[lang] || store["zh-cn"] || {};
            if (dict.docTitle) document.title = dict.docTitle;
            document.querySelectorAll("[data-wg-i18n]").forEach(function (el) {
                var key = el.getAttribute("data-wg-i18n");
                if (dict[key] != null) el.textContent = dict[key];
            });
            document.querySelector("[data-wg-build]").textContent = window.WG_BUILD;
        })();
    </script>
</body>
</html>
