<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>关于Wildgoose</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI",sans-serif;
        }
        body {
            background: #1f203a;
            color: #fff;
            padding: 35px 20px;
            text-align: center;
        }
        .title {
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .text {
            color: #b8b9d3;
            margin-bottom: 35px;
        }
        .info-box {
            background: #292a48;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin: 0 auto 30px;
            max-width: 320px;
        }
        .info-box p {
            margin: 8px 0;
            font-size: 14px;
        }
        button {
            background: #5c68f8;
            border: none;
            color: #fff;
            padding: 6px 24px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="title">Wildgoose BE</div>
    <div class="text">操作系统 版本信息</div>

    <div class="info-box">
        <p>Wildgoose Beginning Edition</p>
        <p>版本：26H05A</p>
        <p>内部版本：1.1.0970</p>
    </div>

</body>
</html>
