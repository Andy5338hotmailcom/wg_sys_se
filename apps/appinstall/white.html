<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WGAPP 安装器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#ffffff;color:#111;height:100vh;display:flex;align-items:center;justify-content:center}
        .box{background:#f5f7fa;padding:40px;border-radius:12px;text-align:center; border:1px solid #eee}
        button{padding:12px 24px;background:#0077ff;border:0;border-radius:6px;color:#fff;font-size:16px;cursor:pointer}
        #info{margin-top:20px;color:#666}
    </style>
</head>
<body>

<div class="box">
    <h2>安装 .wgapp 软件包</h2>
    <button onclick="document.getElementById('file').click()">选择安装包</button>
    <input type="file" id="file" accept=".wgapp" style="display:none">
    <div id="info"></div>
</div>

<script>
const fileInput = document.getElementById('file');
const info = document.getElementById('info');

fileInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const text = await file.text();
    try {
        const app = JSON.parse(text);

        // 验证格式
        if (!app.id || !app.name || !app.path) {
            info.innerText = "❌ 安装失败：格式错误";
            return;
        }

        // 安装：写入 localStorage
        let list = JSON.parse(localStorage.getItem('app_list') || '[]');
        if (list.some(i => i.id === app.id)) {
            info.innerText = "✅ 已安装过该软件";
            return;
        }

        list.push(app);
        localStorage.setItem('app_list', JSON.stringify(list));

        // 添加到桌面
        let desk = JSON.parse(localStorage.getItem('desktopIcons') || '[]');
        if (!desk.includes(app.id)) {
            desk.push(app.id);
            localStorage.setItem('desktopIcons', JSON.stringify(desk));
        }

        info.innerText = `✅ 安装成功：${app.name}\n刷新桌面即可显示`;

    } catch (e) {
        info.innerText = "❌ 不是有效的 wgapp 文件";
    }
};
</script>

</body>
</html>
