<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildgoose OS - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: url("bg.jpg") center/cover no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 头像 */
        .user-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 24px;
        }

        /* 账户名 */
        .username {
            color: #fff;
            font-size: 20px;
            margin-bottom: 32px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.6);
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 320px;
        }

        /* 密码输入框 */
        #passwordInput {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 15px;
            outline: none;
            display: none; /* 默认隐藏 */
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #72c2ff;
            color: #0d1117;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

            .login-btn:hover {
                background: #94d3ff;
            }

        /* 右下角 关机/重启 按钮组 */
        .power-group {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
        }

        .power-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .power-btn:hover {
                background: rgba(255, 255, 255, 0.2);
            }

        .shutdown:hover {
            color: #ff5c5c;
        }

        .restart:hover {
            color: #5cccff;
        }
    </style>
</head>
<body>
    <!-- 头像 -->
    <div class="user-avatar">
        <img src="icon.png" style="width:100%;height:100%;object-fit:cover;">
    </div>

    <!-- 管理员账户 -->
    <div class="username">Administrator</div>

    <div class="login-box">
        <input type="password" id="passwordInput" placeholder="请输入登录密码">
        <button class="login-btn" onclick="login()">登录</button>
    </div>

    <!-- 右下角 关机 + 重启 -->
    <div class="power-group">
        <button class="power-btn restart" onclick="restart()">↺</button>
        <button class="power-btn shutdown" onclick="shutdown()">⏻</button>
    </div>

    <script>
        // 哈希验证函数（和设置页一致）
        function hash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                let chr = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + chr;
                hash |= 0;
            }
            return Math.abs(hash).toString(16);
        }

        // 页面加载时判断是否需要显示密码框
        window.onload = function() {
            const hasPwd = localStorage.getItem("wg_login_hash");
            const pwdInput = document.getElementById("passwordInput");
            if (hasPwd) {
                pwdInput.style.display = "block"; // 有密码 → 显示输入框
            } else {
                pwdInput.style.display = "none";  // 无密码 → 隐藏
            }
        };

        // 登录逻辑
        function login() {
            const savedHash = localStorage.getItem("wg_login_hash");
            const inputVal = document.getElementById("passwordInput").value;

            // 无密码 → 直接进
            if (!savedHash) {
                location.href = "loginwait.html";
                return;
            }

            // 有密码 → 验证
            if (hash(inputVal) === savedHash) {
                location.href = "loginwait.html";
            } else {
                location.href = "passworderror.html";
            }
        }

        // 重启
        function restart() {
            location.href = "restart.html";
        }

        // 关机
        function shutdown() {
            location.href = "shutdown.html";
        }

        // 回车登录
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
