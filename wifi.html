<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi</title>
<style>
    :root {
        color-scheme: light;
        --wifi-text: #1b1b1b;
        --wifi-muted: rgba(0, 0, 0, 0.52);
        --wifi-faint: rgba(0, 0, 0, 0.34);
    }

    :root[data-theme="b"] {
        color-scheme: dark;
        --wifi-text: #f2f2f2;
        --wifi-muted: rgba(255, 255, 255, 0.58);
        --wifi-faint: rgba(255, 255, 255, 0.34);
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        height: 100%;
        margin: 0;
    }

    body {
        display: flex;
        flex-direction: column;
        padding: 16px 18px 14px;
        color: var(--wifi-text);
        font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        background: transparent;
        user-select: none;
        overflow: hidden;
    }

    .head {
        display: flex;
        align-items: baseline;
        gap: 6px;
    }

    .head-title {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: 0.2px;
    }

    .head-sub {
        font-size: 11px;
        color: var(--wifi-muted);
    }

    .body {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
    }

    .icon {
        width: 68px;
        height: 68px;
        color: var(--wifi-faint);
    }

    .icon svg {
        width: 100%;
        height: 100%;
    }

    .message {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.4px;
    }

    .hint {
        margin-top: -4px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--wifi-muted);
    }
</style>
</head>
<body>
    <div class="head">
        <span class="head-title">Wi-Fi</span>
        <span class="head-sub">网络连接</span>
    </div>

    <div class="body">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6" aria-hidden="true">
                <path d="M2.8 8.9a15 15 0 0 1 18.4 0" opacity="0.7"/>
                <path d="M5.9 12.4a10.4 10.4 0 0 1 12.2 0" opacity="0.85"/>
                <path d="M9.1 15.9a5.4 5.4 0 0 1 5.8 0"/>
                <circle cx="12" cy="19.2" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
        </div>
        <div class="message">暂未开发，请期待</div>
        <div class="hint">后续版本会在这里接入无线网络扫描、连接与信号强度。</div>
    </div>

<script>
    // 与桌面其它面板一样，主题切换靠消息同步
    window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "theme-change") return;
        document.documentElement.setAttribute("data-theme", event.data.theme === "b" ? "b" : "w");
    });
    try {
        var saved = localStorage.getItem("WG_color");
        if (saved === "b") document.documentElement.setAttribute("data-theme", "b");
    } catch (error) { /* 本地存储不可用时忽略 */ }
</script>
</body>
</html>
