<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更多启动选项</title>
    <link rel="stylesheet" href="boot.css">
</head>
<body>
    <span class="boot-decor boot-decor-top" aria-hidden="true"></span>
    <span class="boot-decor boot-decor-bottom" aria-hidden="true"></span>

    <main class="boot-page boot-page-options">
        <h1 class="boot-title">更多启动选项</h1>

        <div class="boot-options">
            <section class="boot-option">
                <div class="boot-option-copy">
                    <h2>安全模式</h2>
                    <p>最小化驱动程序启动(已禁用)</p>
                </div>
            </section>

            <section class="boot-option">
                <div class="boot-option-copy">
                    <h2>网络安全模式</h2>
                    <p>带网络支持的安全模式(已禁用)</p>
                </div>
            </section>

            <section class="boot-option">
                <div class="boot-option-copy">
                    <h2>命令提示符</h2>
                    <p>高级命令行操作(已禁用)</p>
                </div>
            </section>

            <section class="boot-option">
                <div class="boot-option-copy">
                    <h2>系统还原</h2>
                    <p>恢复到之前的系统状态(已禁用)</p>
                </div>
            </section>
        </div>

        <div class="boot-actions">
            <a class="boot-button" href="../syschoice.html">
                <span aria-hidden="true">←</span>返回主菜单
            </a>
        </div>
    </main>
</body>
</html>
