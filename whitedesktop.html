<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildgoose OS</title>
    <!-- 引入CSS -->
    <link rel="stylesheet" href="whitedesktop.css">
    <script src="desktop.js"></script>
</head>
<body>

<!-- ======================== -->
<!-- 1. 桌面图标区域 -->
<!-- ======================== -->
<div id="desktop-icons"></div>

<!-- ======================== -->
<!-- 2. 任务栏 -->
<!-- ======================== -->
<div class="taskbar">
    <button class="start-btn">开始</button>
    <div class="task-apps"></div>
    <div class="task-right">
        <div class="show-desktop">显示桌面</div>
        <div class="time" id="time"></div>
    </div>
</div>

<!-- ======================== -->
<!-- 3. 开始菜单（iframe 容器，主体逻辑在 startmenu.html） -->
<!-- ======================== -->
<div class="start-menu" id="startMenu">
    <iframe id="startMenuFrame" src="startmenu.html" title="开始菜单"></iframe>
</div>

<!-- ======================== -->
<!-- 4. 窗口容器 -->
<!-- ======================== -->
<div id="window-container"></div>

</body>
</html>
